services:
  postgres:
    image: postgres:16-alpine
    container_name: marvel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: marvel
      POSTGRES_PASSWORD: marvel123
      POSTGRES_DB: marvel_db
    ports:
      - "5433:5432"
    volumes:
      - marvel_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marvel -d marvel_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./api
    ports: ["3000:3000"]
    environment:
      PGHOST: postgres
      PGUSER: marvel
      PGPASSWORD: marvel123
      PGDATABASE: marvel_db
    depends_on: [postgres]
volumes:
  marvel_data:
